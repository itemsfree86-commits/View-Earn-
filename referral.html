<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral - View Earn</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif}
        body{background:#0b0614;color:#fff;overflow-x:hidden; min-height: 100vh;}
        #snowCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99999; }
        .app{position:relative;z-index:10;padding:20px;padding-bottom:120px; animation: fadeIn 0.8s ease-in-out;}
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .glass-card{ background: rgba(25, 12, 45, 0.6); backdrop-filter: blur(12px); border-radius: 24px; padding: 25px; margin-bottom: 18px; border: 1px solid rgba(211, 107, 255, 0.2); text-align:center;}
        .refer-icon{ font-size: 50px; color: #d36bff; margin-bottom: 15px; }
        .bonus-badge { background: rgba(125, 255, 179, 0.2); color: #7dffb3; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        .link-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 15px; border: 1px dashed #d36bff; font-size: 11px; color: #ccc; word-break: break-all; margin: 15px 0; cursor: pointer; position: relative; text-align: left; }
        .btn-share{ width:100%; padding:18px; border:none; border-radius:18px; font-size:16px; font-weight:bold; color:#fff; background: linear-gradient(135deg,#a400ff,#ff00cc); cursor:pointer; box-shadow: 0 8px 20px rgba(180,0,255,0.3); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .stat-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .bottom-nav{ position:fixed; bottom:0; left:0; width:100%; height:80px; background:#0f0719; display:flex; justify-content:space-around; align-items:center; z-index:10000; border-top:1px solid rgba(211,107,255,0.15);}
        .bottom-nav a{ text-decoration:none; color:#777; text-align:center; flex:1; font-size:11px; }
        .bottom-nav a.active{ color:#d36bff; }
        .bottom-nav i{ display:block; font-size:22px; margin-bottom:4px; }
    </style>
</head>
<body>
    <canvas id="snowCanvas"></canvas>
    <div class="app">
        <h1 style="text-align:center; color:#d36bff; margin-bottom:20px; font-weight:800;">Refer & Earn</h1>
        
        <div class="glass-card">
            <i class="fa-solid fa-user-plus refer-icon"></i>
            <h3>Invite Your Friends</h3>
            <p style="font-size: 13px; color: #aaa; margin: 10px 0;">Share your link and get bonus coins for every friend who joins!</p>
            <div class="bonus-badge">+ 1,000 COINS PER REFER</div>
            
            <div class="link-box" onclick="copyLink()">
                <span id="referLink">Loading Link...</span>
                <i class="fa-regular fa-copy" style="position:absolute; right:10px; top:18px; color:#d36bff;"></i>
            </div>
            
            <button class="btn-share" onclick="shareToTelegram()">SHARE ON TELEGRAM</button>
        </div>

        <div class="stat-grid">
            <div class="stat-card">
                <p style="font-size: 10px; color: #aaa;">TOTAL REFERRED</p>
                <h2 id="totalRefs" style="color: #d36bff;">0</h2>
            </div>
            <div class="stat-card">
                <p style="font-size: 10px; color: #aaa;">REFERRAL EARNING</p>
                <h2 id="refEarn" style="color: #7dffb3;">0</h2>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="withdraw.html"><i class="fa-solid fa-wallet"></i><span>Withdraw</span></a>
        <a href="referral.html" class="active"><i class="fa-solid fa-user-group"></i><span>Referral</span></a>
        <a href="tasks.html"><i class="fa-solid fa-layer-group"></i><span>Tasks</span></a>
    </nav>

<script>
    const firebaseConfig = { databaseURL: "https://watch2earn-e5ab2-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const uid = localStorage.getItem("uid");
    
    // Aapke Bot ka correct URL (Mini App link)
    // NOTE: Agar aap Telegram Bot ke andar redirect chahte hain toh ye best hai:
    const botUsername = "bestviewearnonads_bot"; 
    const myReferralLink = `https://t.me/${botUsername}?start=${uid}`;
    
    document.getElementById("referLink").innerText = myReferralLink;

    // Load Stats - KEY FIX: referCount ki jagah referrals use kiya jo index.html mein hai
    if(uid) {
        db.ref("users/" + uid).on("value", snap => {
            const d = snap.val() || {};
            const count = d.referrals || 0;
            document.getElementById("totalRefs").innerText = count;
            document.getElementById("refEarn").innerText = (count * 1000).toLocaleString() + " Coins";
        });
    }

    function copyLink() {
        const link = document.getElementById("referLink").innerText;
        navigator.clipboard.writeText(link);
        alert("Referral Link Copied!");
    }

    function shareToTelegram() {
        const text = encodeURIComponent("🚀 Join this awesome bot and start earning USDT for free!\n\n🎁 Get 1,000 coins as a bonus!");
        window.open(`https://t.me/share/url?url=${encodeURIComponent(myReferralLink)}&text=${text}`);
    }

    // Snow logic
    const canvas=document.getElementById("snowCanvas");const ctx=canvas.getContext("2d");let f=[];function res(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}res();window.onresize=res;for(let i=0;i<40;i++)f.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,s:Math.random()*15+10,sp:Math.random()*0.5+0.2,o:Math.random()*0.3});function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);f.forEach(p=>{ctx.fillStyle=`rgba(255,255,255,${p.o})`;ctx.font=p.s+"px Arial";ctx.fillText("❄",p.x,p.y);p.y+=p.sp;if(p.y>canvas.height)p.y=-20});requestAnimationFrame(draw)}draw();
</script>
</body>
</html>
