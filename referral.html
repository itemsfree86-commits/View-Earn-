<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral - View Earn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif}
        body{background:#0b0614;color:#fff;overflow-x:hidden}
        
        .glow-bg{position:fixed;inset:-50%;background:radial-gradient(circle at 20% 20%,rgba(180,0,255,.15),transparent 40%),radial-gradient(circle at 80% 80%,rgba(120,0,255,.1),transparent 45%); z-index:0; pointer-events:none}
        .app{position:relative;z-index:2;padding:20px;padding-bottom:100px}

        /* CORNER POP ANIMATION */
        .card {
            background: #160a25; 
            border-radius: 24px; 
            padding: 25px; 
            margin-bottom: 20px; 
            border: 1px solid rgba(211, 107, 255, 0.25); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            opacity:0;
            transform: scale(0.4) rotate(-8deg); 
            transform-origin: top left; 
            animation: cornerPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            text-align: center;
        }
        @keyframes cornerPop { to { opacity: 1; transform: scale(1) rotate(0deg); } }

        h1{text-align:center; color:#d36bff; margin-bottom:25px; font-size:30px; letter-spacing: 1px; text-shadow: 0 0 15px rgba(211, 107, 255, 0.4);}
        
        .ref-code-box {
            background: #0f0719;
            padding: 18px;
            border-radius: 15px;
            border: 1px dashed #d36bff;
            margin: 20px 0;
            font-size: 18px;
            font-weight: bold;
            color: #7dffb3;
            word-break: break-all;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .btn { 
            width:100%; padding:18px; border-radius:16px; border:none; 
            background: linear-gradient(135deg, #8a2be2, #ff00cc); 
            color:#fff; font-weight:800; cursor:pointer; font-size: 16px;
            box-shadow: 0 8px 20px rgba(138, 43, 226, 0.4); transition: 0.3s;
        }
        .btn:active { transform: scale(0.96); opacity: 0.9; }

        .stat-row { display: flex; justify-content: space-around; margin-top: 15px; }
        .stat-item { text-align: center; }
        .stat-item h4 { color: #d36bff; font-size: 20px; }
        .stat-item p { font-size: 12px; opacity: 0.6; }

        .bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:75px;background:#0f0719;display:flex;justify-content:space-around;align-items:center;z-index:10000;border-top:1px solid rgba(211,107,255,0.15)}
        .bottom-nav a{text-decoration:none;color:rgba(255,255,255,0.4);text-align:center;flex:1; transition: 0.3s;}
        .bottom-nav a.active{color:#d36bff; transform: translateY(-5px);}
        .bottom-nav i{display:block;font-size:22px;margin-bottom:5px}
        .bottom-nav span{font-size:11px; font-weight: 600;}
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="app">
        <h1><i class="fa-solid fa-gift"></i> Refer & Earn</h1>
        
        <div class="card">
            <h3 style="font-size: 18px;">Your Invitation Link</h3>
            <p style="font-size: 13px; opacity: 0.7; margin-top: 5px;">Share this link to earn 100 coins per friend!</p>
            <div class="ref-code-box" id="refLink">Generating...</div>
            <button class="btn" onclick="copyRef()">COPY LINK</button>
        </div>

        <div class="card" style="animation-delay: 0.3s;">
            <h3 style="font-size: 18px; margin-bottom: 15px;">Referral Stats</h3>
            <div class="stat-row">
                <div class="stat-item">
                    <h4 id="totalRef">0</h4>
                    <p>Friends Joined</p>
                </div>
                <div class="stat-item">
                    <h4 id="refEarnings">0</h4>
                    <p>Coins Earned</p>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="withdraw.html"><i class="fa-solid fa-wallet"></i><span>Withdraw</span></a>
        <a href="referral.html" class="active"><i class="fa-solid fa-user-group"></i><span>Referral</span></a>
        <a href="tasks.html"><i class="fa-solid fa-layer-group"></i><span>Tasks</span></a>
    </nav>

    <script>
        const uid = localStorage.getItem("uid") || "USER";
        // Referral Link Logic
        const myRefLink = window.location.origin + "/index.html?ref=" + uid;
        document.getElementById("refLink").innerText = myRefLink;

        function copyRef() {
            navigator.clipboard.writeText(myRefLink);
            alert("Referral Link Copied!");
        }

        // Firebase logic for stats (Optional)
        // Yahan aap apne firebase se referral count aur earnings fetch kar sakte hain
    </script>

    <script>
        (function(){
            const canvas=document.createElement("canvas");
            Object.assign(canvas.style,{position:"fixed",top:0,left:0,width:"100%",height:"100%",pointerEvents:"none",zIndex:9999});
            document.body.appendChild(canvas);
            const ctx=canvas.getContext("2d");
            let w,h,snow=[];
            function resize(){w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight;}
            window.addEventListener("resize",resize); resize();
            for(let i=0;i<35;i++){ snow.push({x:Math.random()*w,y:Math.random()*h,s:Math.random()*15+10,sp:Math.random()*0.8+0.3,o:Math.random()*0.4+0.2});}
            function draw(){
                ctx.clearRect(0,0,w,h); ctx.fillStyle="#fff";
                snow.forEach(f=>{
                    ctx.globalAlpha=f.o; ctx.font=f.s+"px Arial";
                    ctx.fillText("❄",f.x,f.y); f.y+=f.sp;
                    if(f.y>h){f.y=-20; f.x=Math.random()*w;}
                });
                requestAnimationFrame(draw);
            } draw();
        })();
    </script>
</body>
</html>
