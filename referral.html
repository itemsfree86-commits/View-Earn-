<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Earn - Referral</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif}
        body{background:#0b0614;color:#fff;overflow-x:hidden;min-height:100vh}
        #snowCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}
        
        .app{position:relative;z-index:10;padding:20px;padding-bottom:120px; animation: fadeIn 0.8s ease;}
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card {
            background: rgba(25, 12, 45, 0.6); backdrop-filter: blur(10px);
            border: 1px solid rgba(211, 107, 255, 0.2); border-radius: 24px;
            padding: 25px; margin-bottom: 20px; text-align: center;
        }

        h1{color:#d36bff; font-size:32px; margin-bottom:20px; text-shadow:0 0 10px rgba(180,0,255,0.4)}
        .ref-link-display{
            font-size:16px; color:#fff; font-weight:bold; letter-spacing:1px; 
            margin:15px 0; padding:10px; background:rgba(0,0,0,0.2); border-radius:8px;
            overflow-wrap: break-word; /* Long links ke liye */
        }
        
        .btn{
            width:100%; padding:18px; background:linear-gradient(135deg,#a400ff,#ff00cc);
            color:#fff; border-radius:16px; font-weight:bold; border:none; cursor:pointer;
            font-size:16px; box-shadow:0 5px 15px rgba(164,0,255,0.3); transition: 0.3s;
        }
        .btn:active { transform: scale(0.96); }

        .bottom-nav{
            position:fixed;bottom:0;left:0;width:100%;height:80px;background:#0f0719;
            display:flex;justify-content:space-around;align-items:center;z-index:10000;
            border-top:1px solid rgba(211,107,255,0.15)
        }
        .bottom-nav a{text-decoration:none;color:#777;text-align:center;flex:1}
        .bottom-nav a.active{color:#d36bff}
        .bottom-nav i{display:block;font-size:24px;margin-bottom:6px}
        .bottom-nav span{font-size:12px}
    </style>
</head>
<body>
    <canvas id="snowCanvas"></canvas>
    <div class="app">
        <h1>Refer & Earn</h1>
        <div class="glass-card">
            <p style="opacity:0.7">Share your link and get 500 coins per referral!</p>
            <div class="ref-link-display" id="refLink">Loading Your Link...</div>
            <button class="btn" onclick="copyRef()">COPY LINK</button>
        </div>
        
        <div class="glass-card">
            <h3 style="margin-bottom:10px">Your Stats</h3>
            <p>Total Referrals: <span id="totalRef" style="color:#7dffb3;font-weight:bold">0</span></p>
            <p style="margin-top:8px;">Referral Earnings: <span id="refEarnings" style="color:#7dffb3;font-weight:bold">0 Coins</span></p>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="withdraw.html"><i class="fa-solid fa-wallet"></i><span>Withdraw</span></a>
        <a href="referral.html" class="active"><i class="fa-solid fa-user-group"></i><span>Referral</span></a>
        <a href="tasks.html"><i class="fa-solid fa-layer-group"></i><span>Tasks</span></a>
    </nav>

<script>
    const firebaseConfig={databaseURL:"https://watch2earn-e5ab2-default-rtdb.firebaseio.com/"};
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    const db=firebase.database(); 
    const uid=localStorage.getItem("uid");

    // Yahan "YOUR_BOT_USERNAME" ki jagah apne bot ka username daalo (without @)
    const BOT_USERNAME = "YourBotName"; // For example: "ViewEarnBot"

    const botLink = `https://t.me/${bestviewearnonads_bot}?start=${uid}`;
    document.getElementById("refLink").innerText = botLink;

    db.ref("users/"+uid).on("value", snap => {
        const userData = snap.val() || {};
        document.getElementById("totalRef").innerText = userData.referrals || 0;
        // Assuming referral earnings are separate or part of total earned
        document.getElementById("refEarnings").innerText = (userData.referral_earnings || 0) + " Coins";
    });

    function copyRef() {
        navigator.clipboard.writeText(botLink)
            .then(() => {
                alert("Referral link copied to clipboard!");
            })
            .catch(err => {
                console.error('Failed to copy text: ', err);
                alert("Failed to copy link. Please copy manually.");
            });
    }

    // Snow Lite Script
    const canvas=document.getElementById("snowCanvas"); const ctx=canvas.getContext("2d");
    let flakes=[]; function res(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
    res(); window.onresize=res;
    for(let i=0;i<40;i++) flakes.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*15+10, sp:Math.random()*0.5+0.2, o:Math.random()*0.3});
    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        flakes.forEach(p=>{
            ctx.fillStyle=`rgba(255,255,255,${p.o})`;
            ctx.font=p.s+"px Arial"; ctx.fillText("❄",p.x,p.y);
            p.y+=p.sp; if(p.y>canvas.height)p.y=-20;
        });
        requestAnimationFrame(draw);
    } draw();
</script>
</body>
</html>
