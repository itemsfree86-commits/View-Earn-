<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Earn - Referral</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif}
        body{background:#0b0614;color:#fff;overflow-x:hidden;min-height:100vh}
        #snowCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}
        
        .app{position:relative;z-index:10;padding:20px;padding-bottom:120px; animation: fadeIn 0.8s ease;}
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card {
            background: rgba(25, 12, 45, 0.6); backdrop-filter: blur(10px);
            border: 1px solid rgba(211, 107, 255, 0.2); border-radius: 24px;
            padding: 25px; margin-bottom: 20px; text-align: center;
        }

        h1{color:#d36bff; font-size:32px; margin-bottom:20px; text-shadow:0 0 10px rgba(180,0,255,0.4)}
        
        .ref-link-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            border: 1px dashed rgba(211, 107, 255, 0.5);
            font-size: 14px;
            word-break: break-all;
            color: #7dffb3;
        }
        
        .btn{
            width:100%; padding:18px; background:linear-gradient(135deg,#a400ff,#ff00cc);
            color:#fff; border-radius:16px; font-weight:bold; border:none; cursor:pointer;
            font-size:16px; box-shadow:0 5px 15px rgba(164,0,255,0.3); transition: 0.3s;
        }
        .btn:active { transform: scale(0.96); }

        .bottom-nav{
            position:fixed;bottom:0;left:0;width:100%;height:80px;background:#0f0719;
            display:flex;justify-content:space-around;align-items:center;z-index:10000;
            border-top:1px solid rgba(211,107,255,0.15)
        }
        .bottom-nav a{text-decoration:none;color:#777;text-align:center;flex:1}
        .bottom-nav a.active{color:#d36bff}
        .bottom-nav i{display:block;font-size:24px;margin-bottom:6px}
        .bottom-nav span{font-size:12px}
    </style>
</head>
<body>
    <canvas id="snowCanvas"></canvas>
    <div class="app">
        <h1>Refer & Earn</h1>
        <div class="glass-card">
            <p style="opacity:0.7">Invite friends and get 500 coins instantly!</p>
            <div class="ref-link-box" id="refLink">Generating Link...</div>
            <button class="btn" onclick="copyRef()">COPY REFERRAL LINK</button>
        </div>
        
        <div class="glass-card">
            <h3 style="margin-bottom:15px; color:#d36bff">Your Network</h3>
            <div style="display:flex; justify-content:space-around">
                <div>
                    <p style="font-size:12px; opacity:0.6">REFERRALS</p>
                    <h2 id="totalRef" style="color:#7dffb3">0</h2>
                </div>
                <div>
                    <p style="font-size:12px; opacity:0.6">EARNINGS</p>
                    <h2 id="refEarnings" style="color:#7dffb3">0</h2>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="withdraw.html"><i class="fa-solid fa-wallet"></i><span>Withdraw</span></a>
        <a href="referral.html" class="active"><i class="fa-solid fa-user-group"></i><span>Referral</span></a>
        <a href="tasks.html"><i class="fa-solid fa-layer-group"></i><span>Tasks</span></a>
    </nav>

<script>
    // 1. Firebase Setup
    const firebaseConfig={databaseURL:"https://watch2earn-e5ab2-default-rtdb.firebaseio.com/"};
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    const db=firebase.database(); 

    // 2. BOT CONFIGURATION (IMPORTANT)
    // Yahan apne bot ka username likho bina @ ke
    const BOT_USERNAME = "bestviewearnonads_bot"; 

    function initReferral() {
        const uid = localStorage.getItem("uid");
        
        if(!uid) {
            document.getElementById("refLink").innerText = "Error: UID not found. Re-open Home.";
            return;
        }

        // Generate Bot Link
        const fullLink = `https://t.me/${}?start=${uid}`;
        document.getElementById("refLink").innerText = fullLink;

        // Load Real-time Stats
        db.ref("users/" + uid).on("value", snap => {
            const val = snap.val() || {};
            document.getElementById("totalRef").innerText = val.referrals || 0;
            document.getElementById("refEarnings").innerText = (val.referral_earnings || 0);
        });
    }

    // Run on load
    window.onload = initReferral;

    // 3. Copy Function
    function copyRef() {
        const link = document.getElementById("refLink").innerText;
        if(link.includes("Generating") || link.includes("Error")) return;

        navigator.clipboard.writeText(link).then(() => {
            alert("Copied! Now share it with friends.");
        });
    }

    // 4. Lite Snow Effect
    const canvas=document.getElementById("snowCanvas"); const ctx=canvas.getContext("2d");
    let flakes=[]; function res(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
    res(); window.onresize=res;
    for(let i=0;i<40;i++) flakes.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*15+10, sp:Math.random()*0.5+0.2, o:Math.random()*0.3});
    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        flakes.forEach(p=>{
            ctx.fillStyle=`rgba(255,255,255,${p.o})`;
            ctx.font=p.s+"px Arial"; ctx.fillText("❄",p.x,p.y);
            p.y+=p.sp; if(p.y>canvas.height)p.y=-20;
        });
        requestAnimationFrame(draw);
    } draw();
</script>
</body>
    </html>
