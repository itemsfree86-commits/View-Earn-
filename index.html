<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Earn - Home</title>
    
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    
    <script src='//libtl.com/sdk.js' data-zone='10407398' data-sdk='show_10407398'></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif}
        body{background:#0b0614;color:#fff;overflow-x:hidden; min-height: 100vh;}
        #snowCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
        
        .app { position:relative; z-index:10; padding: 20px; padding-top: 70px; padding-bottom: 120px; }
        h1{text-align:center;font-size:32px;color:#d36bff;text-shadow:0 0 10px rgba(180,0,255,0.4);margin-bottom:20px}
        .glass-card{ background: rgba(25, 12, 45, 0.6); backdrop-filter: blur(10px); border-radius: 24px; padding: 20px; margin-bottom: 18px; border: 1px solid rgba(211, 107, 255, 0.2); text-align:center; }
        .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .stat h2{color:#7dffb3;font-size:24px;margin-bottom:4px}
        .stat p{font-size:12px;opacity:0.6;text-transform:uppercase}
        
        .btn{ width:100%;padding:18px;border:none;border-radius:18px;font-size:16px; font-weight:bold;color:#fff;background:linear-gradient(135deg,#a400ff,#ff00cc); cursor:pointer; box-shadow:0 5px 15px rgba(180,0,255,0.3); transition: 0.3s; }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { background: #444; opacity: 0.7; }

        .bottom-nav{ position:fixed;bottom:0;left:0;width:100%;height:80px;background:#0f0719; display:flex;justify-content:space-around;align-items:center;z-index:10000; border-top:1px solid rgba(211,107,255,0.15) }
        .bottom-nav a{text-decoration:none;color:#777;text-align:center;flex:1}
        .bottom-nav a.active{color:#d36bff}
        .bottom-nav i{display:block;font-size:24px;margin-bottom:6px}

        .aads-container { position: fixed; top: 0; left: 0; width: 100%; z-index: 10001; background: rgba(11, 6, 20, 0.9); border-bottom: 1px solid rgba(211, 107, 255, 0.2); }
    </style>
</head>
<body>
     
    <div class="aads-container">
      <div style="width:100%; height:60px; display:flex; align-items:center; justify-content:center;">
          <iframe data-aa=2422967 src=//acceptable.a-ads.com/2422967/?size=Adaptive style='border:0; padding:0; width:70%; height:50px; overflow:hidden;'></iframe>
      </div>
    </div>

    <canvas id="snowCanvas"></canvas>

    <div class="app">
        <h1>View Earn</h1>
        <div class="glass-card">
            <p style="font-size:12px; opacity:0.6; margin-bottom:5px">ESTIMATED BALANCE</p>
            <h2 id="usdBalance" style="color:#7dffb3; font-size:30px">$0.000000</h2>
            <p id="rateInfo" style="font-size: 10px; opacity: 0.5; margin-top: 5px;">Rate: Loading...</p>
        </div>
        <div class="stats">
            <div class="glass-card stat"><h2 id="mainBalance">0</h2><p>Coins</p></div>
            <div class="glass-card stat"><h2 id="totalEarned">0</h2><p>Total</p></div>
            <div class="glass-card stat"><h2 id="refCount">0</h2><p>Refs</p></div>
            <div class="glass-card stat"><h2 id="todayViews">0</h2><p>Views</p></div>
        </div>
        <div class="glass-card">
            <button class="btn" id="adBtn" onclick="showMonetagAd()">SHOW AD & EARN +10</button>
            <p id="statusMsg" style="margin-top:10px; font-size:10px; opacity:0.8; color:#d36bff">Monetag System Active</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="active"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="withdraw.html"><i class="fa-solid fa-wallet"></i><span>Withdraw</span></a>
        <a href="referral.html"><i class="fa-solid fa-user-group"></i><span>Referral</span></a>
        <a href="tasks.html"><i class="fa-solid fa-layer-group"></i><span>Tasks</span></a>
    </nav>

<script>
    const firebaseConfig = { databaseURL: "https://watch2earn-e5ab2-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let uid = localStorage.getItem("uid");
    let coinRate = 0.000001;

    // --- Referral System Logic ---
    async function initApp() {
        const urlParams = new URLSearchParams(window.location.search);
        let refBy = urlParams.get('ref') || urlParams.get('start');

        if (!uid) {
            uid = "user_" + Math.random().toString(36).substr(2, 9);
            localStorage.setItem("uid", uid);
            
            await db.ref("users/" + uid).set({
                balance: 0, earned: 0, views: 0, referrals: 0, joinedAt: Date.now()
            });

            if (refBy && refBy !== uid) {
                db.ref("users/" + refBy).transaction(d => {
                    if (d) {
                        d.referrals = (d.referrals || 0) + 1;
                        d.balance = (d.balance || 0) + 1000;
                    }
                    return d;
                });
            }
        }
        syncData();
    }

    function syncData() {
        db.ref("settings/coin_rate").on("value", snap => {
            if(snap.exists()) coinRate = parseFloat(snap.val());
            document.getElementById("rateInfo").innerText = "Rate: 1 Coin = $" + coinRate.toFixed(8);
        });

        if(uid) {
            db.ref("users/" + uid).on("value", snap => {
                const d = snap.val() || {balance: 0, earned: 0, referrals: 0, views: 0};
                document.getElementById("mainBalance").innerText = Math.floor(d.balance || 0);
                document.getElementById("totalEarned").innerText = d.earned || 0;
                document.getElementById("refCount").innerText = d.referrals || 0;
                document.getElementById("todayViews").innerText = d.views || 0;
                document.getElementById("usdBalance").innerText = "$" + ((d.balance || 0) * coinRate).toFixed(6);
            });
        }
    }

    function showMonetagAd() {
        if (typeof show_10407398 !== 'function') {
            alert("Ads load ho rahi hain, please wait.");
            return;
        }

        const adBtn = document.getElementById("adBtn");
        adBtn.disabled = true;

        show_10407398().then(() => {
            db.ref("users/" + uid).transaction(c => {
                if (c) {
                    c.balance = (c.balance || 0) + 10;
                    c.earned = (c.earned || 0) + 10;
                    c.views = (c.views || 0) + 1;
                }
                return c;
            });
            alert("Coins Added!");
            adBtn.disabled = false;
        }).catch(() => {
            adBtn.disabled = false;
        });
    }

    initApp();

    const canvas=document.getElementById("snowCanvas");const ctx=canvas.getContext("2d");let f=[];function res(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}res();window.onresize=res;for(let i=0;i<40;i++)f.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,s:Math.random()*15+10,sp:Math.random()*0.5+0.2,o:Math.random()*0.3});function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);f.forEach(p=>{ctx.fillStyle=`rgba(255,255,255,${p.o})`;ctx.font=p.s+"px Arial";ctx.fillText("❄",p.x,p.y);p.y+=p.sp;if(p.y>canvas.height)p.y=-20});requestAnimationFrame(draw)}draw();
</script>
</body> 
</html>
