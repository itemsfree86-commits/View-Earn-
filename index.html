<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - View Earn</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif}
        body{background:#0b0614;color:#fff;overflow-x:hidden; min-height: 100vh;}
        #snowCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99999; }
        .app{position:relative;z-index:10;padding:20px;padding-bottom:120px;}
        
        /* Wahi Glass Card Design */
        .glass-card{ background: rgba(25, 12, 45, 0.6); backdrop-filter: blur(12px); border-radius: 24px; padding: 20px; margin-bottom: 18px; border: 1px solid rgba(211, 107, 255, 0.2); text-align:center;}
        
        .balance-val { font-size: 32px; font-weight: 800; color: #d36bff; margin: 5px 0; }
        
        /* WATCH ADS BUTTON */
        .ads-btn {
            width: 100%; padding: 20px; border-radius: 20px; border: none;
            background: linear-gradient(135deg, #a400ff, #ff00cc);
            color: white; font-size: 18px; font-weight: 800; cursor: pointer;
            box-shadow: 0 10px 20px rgba(164,0,255,0.3); transition: 0.3s;
            margin-top: 10px;
        }
        .ads-btn:disabled { background: #444; opacity: 0.6; cursor: not-allowed; box-shadow: none; }
        
        #adStatus { font-size: 12px; margin-top: 10px; color: #aaa; }

        .bottom-nav{ position:fixed; bottom:0; left:0; width:100%; height:80px; background:#0f0719; display:flex; justify-content:space-around; align-items:center; z-index:10000; border-top:1px solid rgba(211,107,255,0.15);}
        .bottom-nav a{ text-decoration:none; color:#777; text-align:center; flex:1; font-size:11px; }
        .bottom-nav a.active{ color:#d36bff; }
        .bottom-nav i{ display:block; font-size:22px; margin-bottom:4px; }
    </style>
</head>
<body>
    <canvas id="snowCanvas"></canvas>
    
    <div class="app">
        <h1 style="text-align:center; color:#d36bff; margin-bottom:20px; font-weight:800;">View Earn</h1>

        <div class="glass-card">
            <p style="font-size:12px; opacity:0.6;">AVAILABLE BALANCE</p>
            <div class="balance-val" id="userBalance">0 Coins</div>
            <p id="usdValue" style="color:#7dffb3; font-weight:bold;">$0.0000</p>
        </div>

        <div class="glass-card">
            <i class="fa-solid fa-play-circle" style="font-size:40px; color:#d36bff; margin-bottom:10px;"></i>
            <h3>Watch Video Ads</h3>
            <p style="font-size:11px; opacity:0.6; margin-bottom:15px;">Watch ads to earn instant coins</p>
            
            <button id="watchAdBtn" class="ads-btn" onclick="showAd()" disabled>
                <i class="fa-solid fa-video"></i> WATCH AD
            </button>
            <p id="adStatus">Initializing Ads...</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="active"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="withdraw.html"><i class="fa-solid fa-wallet"></i><span>Withdraw</span></a>
        <a href="referral.html"><i class="fa-solid fa-user-group"></i><span>Referral</span></a>
        <a href="tasks.html"><i class="fa-solid fa-layer-group"></i><span>Tasks</span></a>
    </nav>

<script>
    // Firebase Setup
    const firebaseConfig = { databaseURL: "https://watch2earn-e5ab2-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const uid = localStorage.getItem("uid");

    let currentBalance = 0;
    let coinRate = 0;

    // --- ADS LOADING LOGIC (Pata chalega ki load ho rha hai ya nahi) ---
    const adBtn = document.getElementById("watchAdBtn");
    const adStatus = document.getElementById("adStatus");

    // Ye function simulate kar rha hai ads loading ko
    function loadAds() {
        adStatus.innerText = "Loading Ads... Please wait";
        adBtn.disabled = true;

        // Yahan aapka Ad Network ka code aayega (AppLovin/AdMob etc)
        // Testing ke liye 3 second baad active kar rhe hain
        setTimeout(() => {
            adStatus.innerText = "Ads Loaded! Ready to watch";
            adStatus.style.color = "#7dffb3";
            adBtn.disabled = false;
        }, 3000);
    }

    function showAd() {
        alert("Ad is playing...");
        // Ad khatam hone ke baad reward logic:
        const reward = 10; 
        db.ref("users/" + uid).update({
            balance: currentBalance + reward
        });
        loadAds(); // Agle ad ke liye firse loading start
    }

    // Rate & Balance Sync
    db.ref("settings/coin_rate").on("value", snap => { coinRate = snap.val() || 0; updateUSD(); });
    db.ref("settings/coins_rate").on("value", snap => { coinRate = snap.val() || 0; updateUSD(); });

    if(uid) {
        db.ref("users/" + uid).on("value", snap => {
            const data = snap.val() || {balance: 0};
            currentBalance = data.balance;
            document.getElementById("userBalance").innerText = currentBalance.toLocaleString() + " Coins";
            updateUSD();
        });
    }

    function updateUSD() {
        document.getElementById("usdValue").innerText = "$" + (currentBalance * coinRate).toFixed(5);
    }

    // Initialize
    loadAds();

    // Snow script
    const canvas=document.getElementById("snowCanvas");const ctx=canvas.getContext("2d");let f=[];function res(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}res();window.onresize=res;for(let i=0;i<50;i++)f.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,s:Math.random()*15+10,sp:Math.random()*0.8+0.3,o:Math.random()*0.5});function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);f.forEach(p=>{ctx.fillStyle=`rgba(255,255,255,${p.o})`;ctx.font=p.s+"px Arial";ctx.fillText("❄",p.x,p.y);p.y+=p.sp;if(p.y>canvas.height)p.y=-20});requestAnimationFrame(draw)}draw();
</script>
</body>
    </html>
