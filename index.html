<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - View Earn</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif}
        body{background:#0b0614;color:#fff;overflow-x:hidden; min-height: 100vh;}
        
        /* Snowfall Foreground */
        #snowCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99999; }
        
        .app{position:relative;z-index:10;padding:20px;padding-bottom:120px;}
        
        .glass-card{ 
            background: rgba(25, 12, 45, 0.6); backdrop-filter: blur(12px); 
            border-radius: 24px; padding: 25px; margin-bottom: 18px; 
            border: 1px solid rgba(211, 107, 255, 0.2); text-align:center;
        }

        .balance-title { font-size: 12px; opacity: 0.6; letter-spacing: 1px; margin-bottom: 5px; }
        .balance-value { font-size: 36px; font-weight: 800; color: #d36bff; text-shadow: 0 0 15px rgba(211, 107, 255, 0.3); }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); }
        .stat-item i { font-size: 20px; color: #7dffb3; margin-bottom: 8px; }

        /* Bottom Nav */
        .bottom-nav{ position:fixed; bottom:0; left:0; width:100%; height:80px; background:#0f0719; display:flex; justify-content:space-around; align-items:center; z-index:10000; border-top:1px solid rgba(211,107,255,0.15);}
        .bottom-nav a{ text-decoration:none; color:#777; text-align:center; flex:1; font-size:11px; transition: 0.3s; }
        .bottom-nav a.active{ color:#d36bff; }
        .bottom-nav i{ display:block; font-size:22px; margin-bottom:4px; }
    </style>
</head>
<body>
    <canvas id="snowCanvas"></canvas>
    
    <div class="app">
        <h1 style="text-align:center; color:#d36bff; margin-bottom:20px; font-weight:800;">View Earn</h1>

        <div class="glass-card">
            <p class="balance-title">YOUR TOTAL BALANCE</p>
            <div class="balance-value" id="userBalance">0</div>
            <p style="font-size:13px; color:#7dffb3; margin-top:5px;" id="usdValue">$0.0000</p>
            
            <div class="stats-grid">
                <div class="stat-item">
                    <i class="fa-solid fa-bolt"></i>
                    <p style="font-size:10px; opacity:0.6;">Tasks Done</p>
                    <p id="tasksCount" style="font-weight:bold;">0</p>
                </div>
                <div class="stat-item">
                    <i class="fa-solid fa-share-nodes"></i>
                    <p style="font-size:10px; opacity:0.6;">Referrals</p>
                    <p id="referCount" style="font-weight:bold;">0</p>
                </div>
            </div>
        </div>

        <div class="glass-card" style="padding:15px; background:linear-gradient(135deg, rgba(164,0,255,0.1), rgba(255,0,204,0.1));">
            <p style="font-size:13px;">Welcome back, <span id="userName" style="color:var(--accent)">User</span>!</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="active"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="withdraw.html"><i class="fa-solid fa-wallet"></i><span>Withdraw</span></a>
        <a href="referral.html"><i class="fa-solid fa-user-group"></i><span>Referral</span></a>
        <a href="tasks.html"><i class="fa-solid fa-layer-group"></i><span>Tasks</span></a>
    </nav>

<script>
    // Firebase Config
    const firebaseConfig = { databaseURL: "https://watch2earn-e5ab2-default-rtdb.firebaseio.com/" };
    
    // SDK Loading Fix: Initialization check
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    
    // User Identity
    let uid = localStorage.getItem("uid");
    
    // Agar UID nahi hai toh test ke liye ya naya banane ke liye logic (optional)
    if(!uid) {
        uid = "user_" + Math.floor(Math.random() * 100000); // Temporary example
        localStorage.setItem("uid", uid);
    }

    let coinRate = 0;

    // Fetch Coin Rate from settings
    function syncRate() {
        db.ref("settings/coin_rate").on("value", snap => {
            if(snap.exists()) {
                coinRate = parseFloat(snap.val());
                updateUSD();
            }
        });
        db.ref("settings/coins_rate").on("value", snap => {
            if(snap.exists()) {
                coinRate = parseFloat(snap.val());
                updateUSD();
            }
        });
    }

    function updateUSD() {
        const bal = parseInt(document.getElementById("userBalance").innerText) || 0;
        document.getElementById("usdValue").innerText = "$" + (bal * coinRate).toFixed(5);
    }

    // Real-time Data Sync
    if(uid) {
        db.ref("users/" + uid).on("value", snap => {
            if(snap.exists()) {
                const data = snap.val();
                document.getElementById("userBalance").innerText = (data.balance || 0).toLocaleString();
                document.getElementById("tasksCount").innerText = data.tasks_completed || 0;
                document.getElementById("referCount").innerText = data.referrals || 0;
                document.getElementById("userName").innerText = data.name || "User";
                updateUSD();
            } else {
                // Agar user naya hai toh database mein create karein
                db.ref("users/" + uid).set({
                    balance: 0,
                    tasks_completed: 0,
                    referrals: 0,
                    name: "Guest User"
                });
            }
        }, error => {
            console.error("SDK Error: ", error);
        });
    }

    syncRate();

    // Snow script (Same as Withdrawal for consistency)
    const canvas=document.getElementById("snowCanvas");const ctx=canvas.getContext("2d");let f=[];function res(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}res();window.onresize=res;for(let i=0;i<50;i++)f.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,s:Math.random()*15+10,sp:Math.random()*0.8+0.3,o:Math.random()*0.5});function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);f.forEach(p=>{ctx.fillStyle=`rgba(255,255,255,${p.o})`;ctx.font=p.s+"px Arial";ctx.fillText("❄",p.x,p.y);p.y+=p.sp;if(p.y>canvas.height)p.y=-20});requestAnimationFrame(draw)}draw();
</script>
</body>
                        </html>
