<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - View Earn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif}
        body{background:#0b0614;color:#fff;overflow-x:hidden}
        
        .glow-bg{position:fixed;inset:-50%;background:radial-gradient(circle at 20% 20%,rgba(180,0,255,.15),transparent 40%),radial-gradient(circle at 80% 80%,rgba(120,0,255,.1),transparent 45%); z-index:0; pointer-events:none}
        .app{position:relative;z-index:2;padding:20px;padding-bottom:100px}

        h1{text-align:center; color:#d36bff; margin-bottom:25px; font-size:30px; letter-spacing: 1px; text-shadow: 0 0 15px rgba(211, 107, 255, 0.4);}

        /* CORNER POP ANIMATION FOR TASKS */
        #taskContainer .task-card {
            background: #160a25; 
            border-radius: 20px; 
            padding: 18px; 
            margin-bottom: 15px; 
            border: 1px solid rgba(211, 107, 255, 0.2); 
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity:0;
            transform: scale(0.4) rotate(-8deg); 
            transform-origin: top left; 
            animation: cornerPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes cornerPop { to { opacity: 1; transform: scale(1) rotate(0deg); } }

        .task-info h3 { font-size: 16px; color: #fff; margin-bottom: 4px; }
        .task-info p { font-size: 13px; color: #7dffb3; font-weight: bold; }

        .go-btn {
            background: linear-gradient(135deg, #8a2be2, #ff00cc);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .go-btn:active { transform: scale(0.9); }

        .bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:75px;background:#0f0719;display:flex;justify-content:space-around;align-items:center;z-index:10000;border-top:1px solid rgba(211,107,255,0.15)}
        .bottom-nav a{text-decoration:none;color:rgba(255,255,255,0.4);text-align:center;flex:1; transition: 0.3s;}
        .bottom-nav a.active{color:#d36bff; transform: translateY(-5px);}
        .bottom-nav i{display:block;font-size:22px;margin-bottom:5px}
        .bottom-nav span{font-size:11px; font-weight: 600;}
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="app">
        <h1><i class="fa-solid fa-layer-group"></i> Daily Tasks</h1>
        
        <div id="taskContainer">
            <p style="text-align:center; opacity:0.5;">Loading tasks...</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="withdraw.html"><i class="fa-solid fa-wallet"></i><span>Withdraw</span></a>
        <a href="referral.html"><i class="fa-solid fa-user-group"></i><span>Referral</span></a>
        <a href="tasks.html" class="active"><i class="fa-solid fa-layer-group"></i><span>Tasks</span></a>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCU0VPokTjGGLhtgwy7aZjgcDJKSO1n4yo",
            authDomain: "watch2earn-e5ab2.firebaseapp.com",
            databaseURL: "https://watch2earn-e5ab2-default-rtdb.firebaseio.com/",
            projectId: "watch2earn-e5ab2",
            storageBucket: "watch2earn-e5ab2.firebasestorage.app",
            messagingSenderId: "904145618894",
            appId: "1:904145618894:web:87a34770482cc731074d9f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const uid = localStorage.getItem("uid");

        // Fetch Tasks from Firebase
        db.ref("tasks").on("value", (snapshot) => {
            const container = document.getElementById("taskContainer");
            container.innerHTML = "";
            let delay = 0.1;

            if(snapshot.exists()) {
                snapshot.forEach((child) => {
                    const task = child.val();
                    const taskHtml = `
                        <div class="task-card" style="animation-delay: ${delay}s">
                            <div class="task-info">
                                <h3>${task.title}</h3>
                                <p>+${task.reward} Coins</p>
                            </div>
                            <button class="go-btn" onclick="completeTask('${child.key}', '${task.link}', ${task.reward})">GO</button>
                        </div>
                    `;
                    container.innerHTML += taskHtml;
                    delay += 0.15; // Har task thoda ruk ke aayega
                });
            } else {
                container.innerHTML = "<p style='text-align:center; opacity:0.5;'>No tasks available today.</p>";
            }
        });

        function completeTask(taskId, link, reward) {
            window.open(link, "_blank");
            // Coins add karne ka logic
            db.ref("users/" + uid + "/balance").transaction(c => (c || 0) + reward);
            alert("Reward added!");
        }
    </script>

    <script>
        (function(){
            const canvas=document.createElement("canvas");
            Object.assign(canvas.style,{position:"fixed",top:0,left:0,width:"100%",height:"100%",pointerEvents:"none",zIndex:9999});
            document.body.appendChild(canvas);
            const ctx=canvas.getContext("2d");
            let w,h,snow=[];
            function resize(){w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight;}
            window.addEventListener("resize",resize); resize();
            for(let i=0;i<35;i++){ snow.push({x:Math.random()*w,y:Math.random()*h,s:Math.random()*15+10,sp:Math.random()*0.8+0.3,o:Math.random()*0.4+0.2});}
            function draw(){
                ctx.clearRect(0,0,w,h); ctx.fillStyle="#fff";
                snow.forEach(f=>{
                    ctx.globalAlpha=f.o; ctx.font=f.s+"px Arial";
                    ctx.fillText("❄",f.x,f.y); f.y+=f.sp;
                    if(f.y>h){f.y=-20; f.x=Math.random()*w;}
                });
                requestAnimationFrame(draw);
            } draw();
        })();
    </script>
</body>
</html>
