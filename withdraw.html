<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - View Earn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif}
        body{background:#0b0614;color:#fff;overflow-x:hidden}
        
        .glow-bg{position:fixed;inset:-50%;background:radial-gradient(circle at 20% 20%,rgba(180,0,255,.15),transparent 40%),radial-gradient(circle at 80% 80%,rgba(120,0,255,.1),transparent 45%); z-index:0; pointer-events:none}
        .app{position:relative;z-index:2;padding:20px;padding-bottom:100px}

        /* CORNER POP ANIMATION (Premium Modern Feel) */
        .card {
            background: #160a25; /* Solid Dark Modern Color */
            border-radius: 24px; 
            padding: 22px; 
            margin-bottom: 20px; 
            border: 1px solid rgba(211, 107, 255, 0.25); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            opacity:0;
            transform: scale(0.4) rotate(-8deg); 
            transform-origin: top left; 
            animation: cornerPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes cornerPop { to { opacity: 1; transform: scale(1) rotate(0deg); } }

        h1{text-align:center; color:#d36bff; margin-bottom:25px; font-size:30px; letter-spacing: 1px; text-shadow: 0 0 15px rgba(211, 107, 255, 0.4);}
        
        label { font-size: 12px; color: #d36bff; margin-left: 5px; font-weight: 600; text-transform: uppercase; }

        input, select { 
            width:100%; padding:16px; margin:8px 0 18px 0; border-radius:15px; 
            border:1px solid rgba(255,255,255,0.1); background:#0f0719; color:#fff; 
            outline:none; transition: 0.3s; font-size: 15px;
        }
        input:focus, select:focus { border-color: #d36bff; box-shadow: 0 0 10px rgba(211, 107, 255, 0.2); }

        .btn { 
            width:100%; padding:18px; border-radius:16px; border:none; 
            background: linear-gradient(135deg, #8a2be2, #ff00cc); 
            color:#fff; font-weight:800; cursor:pointer; font-size: 16px;
            box-shadow: 0 8px 20px rgba(138, 43, 226, 0.4); transition: 0.3s;
        }
        .btn:active { transform: scale(0.96); opacity: 0.9; }

        .bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:75px;background:#0f0719;display:flex;justify-content:space-around;align-items:center;z-index:10000;border-top:1px solid rgba(211,107,255,0.15)}
        .bottom-nav a{text-decoration:none;color:rgba(255,255,255,0.4);text-align:center;flex:1; transition: 0.3s;}
        .bottom-nav a.active{color:#d36bff; transform: translateY(-5px);}
        .bottom-nav i{display:block;font-size:22px;margin-bottom:5px}
        .bottom-nav span{font-size:11px; font-weight: 600;}
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="app">
        <h1><i class="fa-solid fa-building-columns"></i> Withdraw</h1>
        
        <div class="card" style="text-align:center; background: linear-gradient(145deg, #160a25, #1d0d33);">
            <p style="font-size:11px; opacity:0.6; margin-bottom:8px; letter-spacing:1.5px">TOTAL REDEEMABLE BALANCE</p>
            <h2 id="usdBalance" style="color:#7dffb3; font-size:32px; font-weight: 800; text-shadow: 0 0 10px rgba(125, 255, 179, 0.3);">$0.000000</h2>
        </div>

        <div class="card" style="animation-delay: 0.2s;">
            <label>Payment Method</label>
            <select id="method">
                <option value="USDT (BEP20)">USDT (BEP20)</option>
                <option value="TON (Direct)">TON (Direct)</option>
            </select>
            
            <label>Wallet Address</label>
            <input type="text" id="address" placeholder="Paste your address here...">
            
            <label>Amount (In Coins)</label>
            <input type="number" id="amount" placeholder="Minimum 500 coins">
            
            <button class="btn" onclick="requestWithdraw()">CONFIRM WITHDRAWAL</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="withdraw.html" class="active"><i class="fa-solid fa-wallet"></i><span>Withdraw</span></a>
        <a href="referral.html"><i class="fa-solid fa-user-group"></i><span>Referral</span></a>
        <a href="tasks.html"><i class="fa-solid fa-layer-group"></i><span>Tasks</span></a>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCU0VPokTjGGLhtgwy7aZjgcDJKSO1n4yo",
            authDomain: "watch2earn-e5ab2.firebaseapp.com",
            databaseURL: "https://watch2earn-e5ab2-default-rtdb.firebaseio.com/",
            projectId: "watch2earn-e5ab2",
            storageBucket: "watch2earn-e5ab2.firebasestorage.app",
            messagingSenderId: "904145618894",
            appId: "1:904145618894:web:87a34770482cc731074d9f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const uid = localStorage.getItem("uid");

        db.ref("users/" + uid).on("value", s => {
            const data = s.val() || {balance: 0};
            document.getElementById("usdBalance").innerText = "$" + (data.balance * 0.000001).toFixed(6);
        });

        function requestWithdraw() {
            const addr = document.getElementById("address").value;
            const amt = document.getElementById("amount").value;
            const meth = document.getElementById("method").value;
            if(!addr || !amt) return alert("Bhai, address aur amount toh daalo!");
            
            db.ref("withdrawals").push({
                uid: uid,
                address: addr,
                amount: amt,
                method: meth,
                status: "pending",
                timestamp: Date.now()
            }).then(() => {
                alert("Request Sent! Admin check karke pay kar dega.");
                document.getElementById("address").value = "";
                document.getElementById("amount").value = "";
            });
        }
    </script>

    <script>
        (function(){
            const canvas=document.createElement("canvas");
            Object.assign(canvas.style,{position:"fixed",top:0,left:0,width:"100%",height:"100%",pointerEvents:"none",zIndex:9999});
            document.body.appendChild(canvas);
            const ctx=canvas.getContext("2d");
            let w,h,snow=[];
            function resize(){w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight;}
            window.addEventListener("resize",resize); resize();
            for(let i=0;i<35;i++){ snow.push({x:Math.random()*w,y:Math.random()*h,s:Math.random()*15+10,sp:Math.random()*0.8+0.3,o:Math.random()*0.4+0.2});}
            function draw(){
                ctx.clearRect(0,0,w,h); ctx.fillStyle="#fff";
                snow.forEach(f=>{
                    ctx.globalAlpha=f.o; ctx.font=f.s+"px Arial";
                    ctx.fillText("❄",f.x,f.y); f.y+=f.sp;
                    if(f.y>h){f.y=-20; f.x=Math.random()*w;}
                });
                requestAnimationFrame(draw);
            } draw();
        })();
    </script>
</body>
</html>
