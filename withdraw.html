<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - View Earn</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif}
        body{background:#0b0614;color:#fff;overflow-x:hidden; min-height: 100vh;}
        
        /* Snowfall Foreground */
        #snowCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99999; }
        
        .app{position:relative;z-index:10;padding:20px;padding-bottom:120px;}
        
        /* Notice Box */
        .notice-box { background: rgba(255, 82, 82, 0.1); border: 1px solid rgba(255, 82, 82, 0.3); border-radius: 15px; padding: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .notice-box i { color: #ff5252; font-size: 16px; }
        .notice-box p { font-size: 11px; color: #ff9999; line-height: 1.4; }

        .glass-card{ background: rgba(25, 12, 45, 0.6); backdrop-filter: blur(12px); border-radius: 24px; padding: 20px; margin-bottom: 18px; border: 1px solid rgba(211, 107, 255, 0.2); text-align:center;}
        .input-box, .select-box { width:100%; padding:15px; border-radius:15px; border:1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color:#fff; margin:8px 0; outline:none; font-size:14px;}
        .btn{ width:100%; padding:18px; border:none; border-radius:18px; font-size:16px; font-weight:bold; color:#fff; background: linear-gradient(135deg,#a400ff,#ff00cc); cursor:pointer; box-shadow: 0 8px 20px rgba(180,0,255,0.3); margin-top: 10px;}
        
        .history-item { background: rgba(255, 255, 255, 0.03); border-radius: 15px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #444;}
        .status-pending { border-left-color: #ff9800; }
        .status-approved { border-left-color: #7dffb3; }
        
        .bottom-nav{ position:fixed; bottom:0; left:0; width:100%; height:80px; background:#0f0719; display:flex; justify-content:space-around; align-items:center; z-index:10000; border-top:1px solid rgba(211,107,255,0.15);}
        .bottom-nav a{ text-decoration:none; color:#777; text-align:center; flex:1; font-size:11px; }
        .bottom-nav a.active{ color:#d36bff; }
        .bottom-nav i{ display:block; font-size:22px; margin-bottom:4px; }
    </style>
</head>
<body>
    <canvas id="snowCanvas"></canvas>
    
    <div class="app">
        <h1 style="text-align:center; color:#d36bff; margin-bottom:20px; font-weight:800;">Withdraw</h1>

        <div class="notice-box">
            <i class="fa-solid fa-circle-exclamation"></i>
            <p><b>NOTICE:</b> Min FaucetPay: 1,000 Coins. Min TON/USDT: 20,000 Coins. Payments are processed within 40 minutes - 3 hours. No VPN allowed.</p>
        </div>
        
        <div class="glass-card">
            <p style="font-size:12px; opacity:0.6; margin-bottom:5px;">ESTIMATED RECEIVE</p>
            <h2 id="balanceUSD" style="color:#7dffb3; font-size:32px;">$0.00000</h2>
            <p id="balanceCoins" style="color:#d36bff; font-size:14px; margin-top:5px; font-weight:bold;">0 Coins</p>
            <p id="rateInfo" style="font-size:10px; color:#aaa; margin-top:5px;">Connecting to Server...</p>
        </div>

        <div class="glass-card">
            <select id="method" class="select-box" onchange="toggleInputs()">
                <option value="FaucetPay">FaucetPay (Email + Coin Name)</option>
                <option value="TON (TON Network)">TON (TON Network)</option>
                <option value="USDT (BEP20)">USDT (BEP20)</option>
            </select>

            <div id="faucetSection">
                <input type="email" id="fpEmail" class="input-box" placeholder="FaucetPay Email">
                <input type="text" id="coinName" class="input-box" placeholder="Coin Name (Ex: USDT, LTC)">
            </div>
            <div id="walletSection" style="display:none;">
                <input type="text" id="walletAddr" class="input-box" placeholder="Enter Wallet Address">
            </div>

            <input type="number" id="amount" class="input-box" placeholder="Amount in Coins" oninput="liveCalc()">
            <button class="btn" onclick="submitWithdraw()">CONFIRM WITHDRAWAL</button>
        </div>

        <h3 style="margin: 15px 0 10px 5px; font-size: 16px; color: #d36bff;">Withdrawal History</h3>
        <div id="historyList"></div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="withdraw.html" class="active"><i class="fa-solid fa-wallet"></i><span>Withdraw</span></a>
        <a href="referral.html"><i class="fa-solid fa-user-group"></i><span>Referral</span></a>
        <a href="tasks.html"><i class="fa-solid fa-layer-group"></i><span>Tasks</span></a>
    </nav>

<script>
    const firebaseConfig = { databaseURL: "https://watch2earn-e5ab2-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const uid = localStorage.getItem("uid");

    let currentBalance = 0;
    let coinRate = 0;

    // Toggle Input Boxes
    function toggleInputs() {
        const method = document.getElementById("method").value;
        document.getElementById("faucetSection").style.display = (method === "FaucetPay") ? "block" : "none";
        document.getElementById("walletSection").style.display = (method === "FaucetPay") ? "none" : "block";
    }

    // Live USDT Calculation
    function liveCalc() {
        const amt = document.getElementById("amount").value;
        const display = document.getElementById("balanceUSD");
        if(coinRate > 0 && amt > 0) {
            display.innerText = "$" + (amt * coinRate).toFixed(5);
        } else {
            display.innerText = "$0.00000";
        }
    }

    // Rate Fetching
    function syncRate(path) {
        db.ref(path).on("value", snap => {
            if(snap.exists()) {
                coinRate = parseFloat(snap.val());
                document.getElementById("rateInfo").innerText = "Rate: 1 Coin = $" + coinRate.toFixed(8);
                liveCalc();
            }
        });
    }
    syncRate("settings/coin_rate");
    syncRate("settings/coins_rate");

    // Balance Sync
    if(uid) {
        db.ref("users/" + uid).on("value", snap => {
            const d = snap.val() || {balance: 0};
            currentBalance = d.balance || 0;
            document.getElementById("balanceCoins").innerText = currentBalance.toLocaleString() + " Coins";
        });
    }

    // History Display
    db.ref("withdrawals").orderByChild("uid").equalTo(uid).on("value", snap => {
        const list = document.getElementById("historyList");
        list.innerHTML = "";
        if(!snap.exists()) return list.innerHTML = `<p style="text-align:center; opacity:0.4; font-size:12px;">No history.</p>`;
        
        const data = snap.val();
        Object.keys(data).reverse().forEach(id => {
            const item = data[id];
            const statusClass = "status-" + (item.status ? item.status.toLowerCase() : "pending");
            list.innerHTML += `
                <div class="history-item ${statusClass}">
                    <div>
                        <div style="font-weight:bold; font-size:13px;">${item.method}</div>
                        <div style="font-size:9px; opacity:0.5;">${item.date || ""}</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="color:#7dffb3; font-weight:bold;">$${item.amountInUSD || "0.00"}</div>
                        <div style="font-size:10px; font-weight:bold;">${(item.status || "PENDING").toUpperCase()}</div>
                    </div>
                </div>`;
        });
    });

    function submitWithdraw() {
        const method = document.getElementById("method").value;
        const amt = parseInt(document.getElementById("amount").value);
        let addressStr = "";

        if(method === "FaucetPay") {
            const email = document.getElementById("fpEmail").value;
            const coin = document.getElementById("coinName").value;
            if(!email || !coin) return alert("Fill Email and Coin Name!");
            addressStr = "Email: " + email + " | Coin: " + coin;
        } else {
            addressStr = document.getElementById("walletAddr").value;
            if(!addressStr) return alert("Wallet Address is required!");
        }

        if(coinRate === 0) return alert("Rate still loading...");
        
        // --- Updated Limits Logic ---
        const minLimit = (method === "FaucetPay") ? 1000 : 20000;
        
        if(isNaN(amt) || amt < minLimit) return alert("Minimum coins for " + method + " is " + minLimit.toLocaleString());
        if(amt > currentBalance) return alert("Insufficient balance!");

        const usdFinal = (amt * coinRate).toFixed(5);

        db.ref("users/" + uid).update({ balance: currentBalance - amt });
        db.ref("withdrawals").push({
            uid: uid,
            method: method,
            address: addressStr,
            amountInCoins: amt,
            amountInUSD: usdFinal,
            status: "pending",
            date: new Date().toLocaleString()
        });
        
        alert("Success! Request Sent.");
        document.getElementById("amount").value = "";
        liveCalc();
    }

    // Snow script
    const canvas=document.getElementById("snowCanvas");const ctx=canvas.getContext("2d");let f=[];function res(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}res();window.onresize=res;for(let i=0;i<50;i++)f.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,s:Math.random()*15+10,sp:Math.random()*0.8+0.3,o:Math.random()*0.5});function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);f.forEach(p=>{ctx.fillStyle=`rgba(255,255,255,${p.o})`;ctx.font=p.s+"px Arial";ctx.fillText("❄",p.x,p.y);p.y+=p.sp;if(p.y>canvas.height)p.y=-20});requestAnimationFrame(draw)}draw();
</script>
</body>
</html>
